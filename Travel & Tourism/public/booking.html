<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hotel Booking - SmartTour</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">


    <style>

        body {
            font-family: 'Poppins', sans-serif;
            background: #f5f8fc;
        }

        .navbar-brand {
            font-weight: 700;
            font-size: 24px;
        }

        .booking-section {
            padding: 70px 0;
        }

        .booking-card {
            background: white;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
        }

        .booking-title {
            font-weight: 700;
            margin-top: 10px;
        }

        .form-label {
            font-weight: 600;
        }

        .form-control,
        .form-select {
            padding: 11px 14px;
            border-radius: 10px;
        }

        .btn-book {
            padding: 12px 35px;
            border-radius: 10px;
            font-weight: 600;
        }

        .booking-icon {
            font-size: 50px;
        }

        footer {
            margin-top: 30px;
        }

    </style>

</head>


<body>


<!-- ================= NAVBAR ================= -->

<nav class="navbar navbar-expand-lg bg-white shadow-sm">

    <div class="container">

        <a class="navbar-brand text-primary" href="index.html">
            <i class="bi bi-compass"></i>
            SmartTour
        </a>


        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">

            <span class="navbar-toggler-icon"></span>

        </button>


        <div class="collapse navbar-collapse" id="navbarNav">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="index.html">
                        Home
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="destinations.html">
                        Destinations
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="planner.html">
                        Trip Planner
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="hotels.html">
                        Hotels
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="about.html">
                        About
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="help.html">
                        Help
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="login.html">
                        Login
                    </a>
                </li>

            </ul>

        </div>

    </div>

</nav>



<!-- ================= BOOKING SECTION ================= -->

<section class="booking-section">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-8">

                <div class="booking-card">


                    <!-- Heading -->

                    <div class="text-center mb-4">

                        <i class="bi bi-calendar-check text-primary booking-icon"></i>

                        <h2 class="booking-title">
                            Hotel Booking
                        </h2>

                        <p class="text-muted">
                            Fill in your details to book your stay
                        </p>

                    </div>



                    <form id="bookingForm">


                        <!-- SELECTED HOTEL -->

                        <div class="mb-3">

                            <label class="form-label">
                                Selected Hotel
                            </label>

                            <input type="text"
                                   id="selectedHotel"
                                   class="form-control"
                                   readonly>

                        </div>



                        <!-- NAME + EMAIL -->

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Full Name
                                </label>

                                <input type="text"
                                       id="fullName"
                                       class="form-control"
                                       placeholder="Enter your full name"
                                       required>

                            </div>


                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Email
                                </label>

                                <input type="email"
                                       id="email"
                                       class="form-control"
                                       placeholder="Enter your email"
                                       required>

                            </div>

                        </div>



                        <!-- MOBILE + GUESTS -->

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Mobile Number
                                </label>

                                <input type="tel"
                                       id="mobile"
                                       class="form-control"
                                       placeholder="Enter mobile number"
                                       required>

                            </div>


                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Number of Guests
                                </label>

                                <select id="guests"
                                        class="form-select"
                                        required>

                                    <option value="">
                                        Select guests
                                    </option>

                                    <option value="1">
                                        1 Guest
                                    </option>

                                    <option value="2">
                                        2 Guests
                                    </option>

                                    <option value="3">
                                        3 Guests
                                    </option>

                                    <option value="4">
                                        4 Guests
                                    </option>

                                    <option value="5">
                                        5 Guests
                                    </option>

                                    <option value="6">
                                        6 Guests
                                    </option>

                                </select>

                            </div>

                        </div>



                        <!-- CHECK IN + CHECK OUT -->

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Check-in Date
                                </label>

                                <input type="date"
                                       id="checkIn"
                                       class="form-control"
                                       required>

                            </div>


                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Check-out Date
                                </label>

                                <input type="date"
                                       id="checkOut"
                                       class="form-control"
                                       required>

                            </div>

                        </div>



                        <!-- ROOM TYPE -->

                        <div class="mb-3">

                            <label class="form-label">
                                Room Type
                            </label>

                            <select id="roomType"
                                    class="form-select"
                                    required>

                                <option value="">
                                    Select room type
                                </option>

                                <option value="Standard Room">
                                    Standard Room
                                </option>

                                <option value="Deluxe Room">
                                    Deluxe Room
                                </option>

                                <option value="Suite">
                                    Suite
                                </option>

                            </select>

                        </div>



                        <!-- SPECIAL REQUEST -->

                        <div class="mb-4">

                            <label class="form-label">
                                Special Request
                            </label>

                            <textarea id="specialRequest"
                                      class="form-control"
                                      rows="3"
                                      placeholder="Any special request? (Optional)">
                            </textarea>

                        </div>



                        <!-- BUTTON -->

                        <div class="text-center">

                            <button type="submit"
                                    class="btn btn-primary btn-book">

                                <i class="bi bi-check-circle"></i>

                                Confirm Booking

                            </button>

                        </div>


                    </form>

                </div>

            </div>

        </div>

    </div>

</section>



<!-- ================= FOOTER ================= -->

<footer class="bg-dark text-white text-center py-4">

    <div class="container">

        <p class="mb-1">
            <i class="bi bi-compass"></i>
            <strong>SmartTour</strong>
        </p>

        <small>
            Smart travel planning for your perfect journey.
        </small>

    </div>

</footer>



<!-- Bootstrap JS -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>



<!-- ================= JAVASCRIPT ================= -->

<script>

    // Get hotel name from URL

    const urlParams =
        new URLSearchParams(window.location.search);

    const hotelName =
        urlParams.get("hotel");


    // Show hotel name

    if (hotelName) {

        document.getElementById("selectedHotel").value =
            hotelName;

    }



    // Booking Form

    document.getElementById("bookingForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();


            const name =
                document.getElementById("fullName").value;

            const hotel =
                document.getElementById("selectedHotel").value;


            alert(
                "Booking Successful! 🎉\n\n" +
                "Name: " + name + "\n" +
                "Hotel: " + hotel
            );


            // Reset form

            this.reset();

        });

</script>


</body>

</html>
